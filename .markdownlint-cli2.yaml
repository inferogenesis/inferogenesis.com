fix: true

config:
  MD013: false
  MD033:
    allowed_elements:
      - details
      - summary
  # ADRs in DECISIONS.md reuse section headings under different ADR parents.
  MD024:
    siblings_only: true

# JSX and expressions in MDX trip these rules. cspell and the prose gate cover it.
ignores:
  - "node_modules/**"
  - "dist/**"
  - ".astro/**"
  - "**/*.mdx"
