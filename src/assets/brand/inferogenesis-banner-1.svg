<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="inferogenesis banner">
  <!-- Editable source. Text uses Space Grotesk (Google Fonts: 500 + 700). -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#15281F"/>
      <stop offset="100%" stop-color="#0B1714"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- mark -->
  <g transform="translate(5 127) scale(3.9)">
    <circle cx="50" cy="26" r="15" fill="none" stroke="#E69F00" stroke-width="6.5"/>
    <circle cx="50" cy="26" r="4.5" fill="#F3F0E6"/>
    <rect x="43.5" y="44" width="13" height="44" rx="6.5" fill="#F3F0E6"/>
  </g>

  <!-- wordmark -->
  <text x="330" y="348" font-family="'Space Grotesk',sans-serif" font-size="132" letter-spacing="-1">
    <tspan font-weight="500" fill="#EDF3F0">infero</tspan><tspan font-weight="700" fill="#E69F00">genesis</tspan>
  </text>
  <!-- tagline (swap freely) -->
  <text x="334" y="404" font-family="'Space Grotesk',sans-serif" font-weight="500"
        font-size="33" letter-spacing="0.3" fill="#8FB0A6">continuous active inference, from the first cell</text>
</svg>
