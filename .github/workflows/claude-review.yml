name: claude review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the pull request to review
        required: true
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: claude review
    # Forks don't get the secret.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.head.repo.fork == false
    # ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Move once CI passes there.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Stacked PRs diff against a base a shallow clone never fetched.
          fetch-depth: 0
      # Describes the stored secret without printing it, so a bad value fails here in
      # plain words instead of as the API's 401.
      - name: check the review token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          case "$TOKEN" in
            sk-ant-oat01-*) kind="an OAuth token from claude setup-token" ;;
            sk-ant-api03-*) kind="an API key, not an OAuth token" ;;
            "") kind="empty" ;;
            *) kind="neither an OAuth token nor an API key" ;;
          esac
          whitespace=no
          if [[ "$TOKEN" =~ [[:space:]] ]]; then whitespace=yes; fi
          echo "CLAUDE_CODE_OAUTH_TOKEN: ${#TOKEN} characters, $kind, whitespace inside: $whitespace"
          if [[ "$TOKEN" != sk-ant-oat01-* || "$whitespace" == yes ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is $kind (whitespace: $whitespace). Reset it from claude setup-token."
            exit 1
          fi
      - name: note when the review starts
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        # Gates nothing: main has no required checks and forks skip the job.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          # The checkout is a detached merge commit, so gh can't find the PR by itself.
          prompt: |
            Review pull request #${{ env.PR }} against its merge base. Pass
            ${{ env.PR }} to every `gh pr` command.

            Report every issue you find. Do not filter by severity while
            searching, and tag each finding [BLOCKER] or [NIT]. A severity
            floor applied during the search reads as an instruction to look
            less hard. Filter at output instead.

            Every finding cites path:line and the concrete input, URL or call
            that goes wrong. If you cannot give both, drop it.

            Broken references are the failure mode this repo hits: a link, an
            import, a token name, a frontmatter field or a schema key changed
            in one place and not the others. Check every reference to anything
            this PR renames or moves.

            Any number, version or claim on a page needs a build-time source or
            a hand pin in frontmatter. A warrant belongs on a programme page
            only. A roadmap item belongs inside the roadmap callout only. Flag
            each of these when the diff breaks it.

            Check any item a present `BUILD_PLAN.md` claims this PR closes
            against the diff. Say so if the file is absent.

            Don't report formatting, import order, spelling or type-checker
            output. Prettier, ESLint, cspell, the prose gate and `astro check`
            own those.

            Post one comment with `gh pr comment`: a tally line, blockers in
            full, nits as one-liners capped at five with "plus K similar". Lead
            with "no blockers" when there are none. Don't summarise what the PR
            does, the author knows. Add no attribution footer and no links off
            this repository.
          # Read-only shell forms are allowed because a blocked call still costs a turn.
          # Opus on the opening review, Sonnet on each later push.
          claude_args: >-
            --model ${{ (github.event.action == 'opened' || github.event_name ==
            'workflow_dispatch') && 'claude-opus-5' || 'claude-sonnet-5' }}
            --max-turns 80 --allowed-tools
            "Read,Grep,Glob,Bash(git
            diff:*),Bash(git log:*),Bash(git show:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(gh
            pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
      # The action succeeds even when the agent stops short, say on a denied command,
      # and posts nothing. A review that left no comment fails here instead of passing.
      # A PR that edits this file always fails here: the action skips any run whose
      # workflow differs from main's.
      - name: check the review was posted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINCE: ${{ steps.start.outputs.at }}
        run: |
          posted=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?since=$SINCE" \
            --jq "[.[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\")] | length")
          echo "Review comments on #$PR since $SINCE: $posted"
          if [[ "$posted" -eq 0 ]]; then
            echo "::error::The review posted no comment on #$PR. Its last message is in the step above."
            exit 1
          fi
