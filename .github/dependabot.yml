# Dependency bumps arrive Friday morning, so the weekly upkeep run on Saturday sees their
# checks and lists them in its log. One grouped PR per ecosystem keeps the review short.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      everything-else:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
      timezone: Europe/London
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
